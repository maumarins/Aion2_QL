[package]
name = "questlogg-aion2"
version = "0.2.0"
description = "Painel desktop de rotina e exploração do AION 2"
authors = ["Mauricio"]
edition = "2021"

[lib]
name = "questlogg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
